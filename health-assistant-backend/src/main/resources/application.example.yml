# --------------------------------------------------------
# 智能健康助手配置模板
# 复制为 application.yml 并填入真实值
# --------------------------------------------------------

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-health-assistant-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_health_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:你的数据库密码}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

spring.data.redis.host: ${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port: ${SPRING_DATA_REDIS_PORT:6379}

upload:
  avatar:
    max-size: 5242880
    path: ./uploads/avatars/

jwt:
  secret: 你的JWT密钥Base64
  expiration: 86400000

llm:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:你的DeepSeek API Key}
    model: deepseek-v4-pro
    timeout-ms: 120000
    temperature: 0.2
    max-tokens: 4096
