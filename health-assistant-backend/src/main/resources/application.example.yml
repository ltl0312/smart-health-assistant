server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: smart-health-assistant-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_health_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

upload:
  avatar:
    max-size: ${UPLOAD_AVATAR_MAX_SIZE:5242880}
    path: ${UPLOAD_AVATAR_PATH:/app/uploads/avatars/}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000}

llm:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY}
    model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:120000}
    temperature: ${DEEPSEEK_TEMPERATURE:0.2}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
