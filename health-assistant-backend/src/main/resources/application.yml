# --------------------------------------------------------
# 智能健康助手核心配置文件 (application.yml)
# --------------------------------------------------------

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    connection-timeout: 20000

spring:
  application:
    name: smart-health-assistant-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_health_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: a82711045
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Redis 配置 (排行榜缓存)
spring.data.redis.host: ${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port: ${SPRING_DATA_REDIS_PORT:6379}

# 文件上传配置
upload:
  avatar:
    max-size: 5242880
    path: ./uploads/avatars/

# JWT 鉴权配置
jwt:
  secret: Y29tcGxleF9zZWNyZXRfa2V5X2Zvcl9zbWFydF9oZWFsdGhfMjAyNg==
  expiration: 86400000  # 令牌生命周期: 24小时

# --------------------------------------------------------
# 深度集成 DeepSeek 大模型核心配置
# --------------------------------------------------------
llm:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:sk-d2c2374ea93e4f7d8d55a3624a33839d}
    # 严格指定 V4 Pro 版本
    model: deepseek-v4-flash
    timeout-ms: 60000
    temperature: 0.2
    max-tokens: 4096
